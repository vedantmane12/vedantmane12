<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 190" width="880" height="190" role="img" aria-label="54 repositories, on GitHub since 2018, 3 plus years in production, 3 clouds">
  <title>Profile at a glance</title>

  <defs>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3355ff"/><stop offset="100%" stop-color="#8ba4ff" stop-opacity="0.15"/>
    </linearGradient>
    <clipPath id="cardS"><rect width="880" height="190" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#cardS)">
    <rect width="880" height="190" fill="#08090b"/>

    <text x="48" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="11.5" letter-spacing="2" fill="#5a5a64">AT A GLANCE</text>

    <!-- A rule that draws itself in, left to right. Cheap, and it gives the card
         a beat of motion without anything moving that a reader has to track. -->
    <line x1="48" y1="60" x2="48" y2="60" stroke="url(#rule)" stroke-width="1.5">
      <animate attributeName="x2" from="48" to="832" dur="1.2s" fill="freeze"
               calcMode="spline" keySplines="0.16 1 0.3 1"/>
    </line>

    <!-- Four figures, staggered in. Every animated element also carries its
         final static value, so a renderer that ignores SMIL still shows the card. -->
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">

      <g transform="translate(48,0)" opacity="1">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.25s" fill="freeze"/>
        <text y="120" font-size="42" font-weight="700" letter-spacing="-1.2" fill="#f1f1f2">54</text>
        <text y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
              font-size="11" letter-spacing="1.3" fill="#6e6e78">REPOSITORIES</text>
      </g>

      <g transform="translate(252,0)" opacity="1">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.4s" fill="freeze"/>
        <text y="120" font-size="42" font-weight="700" letter-spacing="-1.2" fill="#f1f1f2">2018</text>
        <text y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
              font-size="11" letter-spacing="1.3" fill="#6e6e78">ON GITHUB SINCE</text>
      </g>

      <g transform="translate(492,0)" opacity="1">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.55s" fill="freeze"/>
        <text y="120" font-size="42" font-weight="700" letter-spacing="-1.2" fill="#f1f1f2">3<tspan font-size="26" fill="#8ba4ff">+</tspan></text>
        <text y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
              font-size="11" letter-spacing="1.3" fill="#6e6e78">YEARS IN PRODUCTION</text>
      </g>

      <g transform="translate(700,0)" opacity="1">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.7s" fill="freeze"/>
        <text y="120" font-size="42" font-weight="700" letter-spacing="-1.2" fill="#f1f1f2">3</text>
        <text y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
              font-size="11" letter-spacing="1.3" fill="#6e6e78">CLOUDS SHIPPED ON</text>
      </g>
    </g>

    <rect width="880" height="190" rx="14" fill="none" stroke="#212229" stroke-width="1"/>
  </g>
</svg>
