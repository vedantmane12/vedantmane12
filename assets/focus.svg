<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" role="img" aria-label="Shipped projects by discipline: Data Engineering 8, AI Systems 4, Machine Learning 3, Databases 1">
  <title>Where the work sits — 16 shipped projects by discipline</title>

  <defs>
    <linearGradient id="barA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3355ff"/><stop offset="100%" stop-color="#8ba4ff"/>
    </linearGradient>
    <clipPath id="cardF"><rect width="880" height="250" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#cardF)">
    <rect width="880" height="250" fill="#08090b"/>

    <text x="48" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="11.5" letter-spacing="2" fill="#5a5a64">WHERE THE WORK SITS</text>
    <text x="832" y="46" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="11.5" letter-spacing="1.4" fill="#5a5a64">16 PROJECTS</text>

    <!-- Bars are scaled against the largest count (8), not against 16, so the
         shorter disciplines stay legible instead of collapsing to a sliver. -->
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14">

      <g transform="translate(48,84)">
        <text x="0" y="5" fill="#f1f1f2">Data Engineering</text>
        <rect x="200" y="-9" width="600" height="18" rx="9" fill="#101116"/>
        <rect x="200" y="-9" height="18" rx="9" fill="url(#barA)" width="600">
          <animate attributeName="width" from="0" to="600" dur="1.1s" begin="0.1s" fill="freeze"
                   calcMode="spline" keySplines="0.16 1 0.3 1"/>
        </rect>
        <text x="820" y="5" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
              font-size="13" fill="#9a9aa4">8</text>
      </g>

      <g transform="translate(48,130)">
        <text x="0" y="5" fill="#f1f1f2">AI Systems</text>
        <rect x="200" y="-9" width="600" height="18" rx="9" fill="#101116"/>
        <rect x="200" y="-9" height="18" rx="9" fill="url(#barA)" width="300">
          <animate attributeName="width" from="0" to="300" dur="1.1s" begin="0.25s" fill="freeze"
                   calcMode="spline" keySplines="0.16 1 0.3 1"/>
        </rect>
        <text x="820" y="5" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
              font-size="13" fill="#9a9aa4">4</text>
      </g>

      <g transform="translate(48,176)">
        <text x="0" y="5" fill="#f1f1f2">Machine Learning</text>
        <rect x="200" y="-9" width="600" height="18" rx="9" fill="#101116"/>
        <rect x="200" y="-9" height="18" rx="9" fill="url(#barA)" width="225">
          <animate attributeName="width" from="0" to="225" dur="1.1s" begin="0.4s" fill="freeze"
                   calcMode="spline" keySplines="0.16 1 0.3 1"/>
        </rect>
        <text x="820" y="5" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
              font-size="13" fill="#9a9aa4">3</text>
      </g>

      <g transform="translate(48,222)">
        <text x="0" y="5" fill="#f1f1f2">Databases</text>
        <rect x="200" y="-9" width="600" height="18" rx="9" fill="#101116"/>
        <rect x="200" y="-9" height="18" rx="9" fill="url(#barA)" width="75">
          <animate attributeName="width" from="0" to="75" dur="1.1s" begin="0.55s" fill="freeze"
                   calcMode="spline" keySplines="0.16 1 0.3 1"/>
        </rect>
        <text x="820" y="5" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
              font-size="13" fill="#9a9aa4">1</text>
      </g>
    </g>

    <rect width="880" height="250" rx="14" fill="none" stroke="#212229" stroke-width="1"/>
  </g>
</svg>
