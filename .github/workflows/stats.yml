name: Refresh profile stats

on:
  schedule:
    # 06:00 UTC daily. Off the hour on purpose: GitHub queues cron-triggered
    # runs and the top of the hour is the most contended slot, so exact-hour
    # schedules are the ones that get delayed or skipped.
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    # So a change to the generator is reflected without waiting for the cron.
    paths:
      - "scripts/build-stats.mjs"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate stats.svg
        env:
          # Unlocks the GraphQL contribution count, which is unavailable
          # without a token. Read-only use of the automatic token; no secret
          # needs to be configured.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-stats.mjs

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- assets/stats.svg; then
            echo "No change to stats.svg, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git commit -m "Refresh profile stats [skip ci]"
          git push
